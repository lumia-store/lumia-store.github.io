# LUMIA social robot — prepares posts every morning, posts approved ones at 8:30 PM Cairo time.
# Installed by the LUMIA Orders project (social/deploy.sh). Settings are GitHub secrets, added from the app.
name: Social robot
on:
  schedule:
    - cron: '10 2 * * *'          # ~4–5 AM Cairo (GitHub may start it later): prepare the next 3 days for approval
    - cron: '35 17,18,19,20 * * *' # evening checks: post what is approved and due (8:30 PM Cairo, summer or winter time)
  workflow_dispatch:
    inputs:
      mode: { description: 'prepare or post', required: true, default: 'prepare', type: choice, options: [prepare, post, test] }
permissions:
  contents: write
  pages: write
concurrency: { group: social-robot, cancel-in-progress: false }
jobs:
  robot:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '10 2 * * *' && 'prepare' || 'post') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Video tool (ffmpeg)
        uses: FedericoCarboni/setup-ffmpeg@v3
        timeout-minutes: 5
      - name: Robot packages
        run: cd social && npm ci --no-audit --no-fund --silent
      - name: Run
        env:
          CHROME_PATH: /usr/bin/google-chrome
          ROBOT_PUSH: '1'
          SITE_URL: https://${{ github.repository_owner }}.github.io/
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ID: ${{ secrets.META_IG_ID }}
          CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          AI_PREFER: ${{ secrets.AI_PREFER }}
        run: |
          git config user.name "LUMIA robot"; git config user.email "robot@users.noreply.github.com"
          if [ "$MODE" = test ]; then   # draws sample posts with test words in a copy of the site; saves nothing
            rm -rf /tmp/s && cp -r . /tmp/s && rm -f /tmp/s/social/queue.json
            SITE_DIR=/tmp/s AI_FAKE=1 ROBOT_PUSH=0 node social/robot.js prepare && ls -la /tmp/s/media/social && exit 0
          fi
          node social/robot.js "$MODE"
      - name: Save
        if: always() && env.MODE != 'test'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git add -A social/queue.json media/social 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -qm "Robot: ${MODE:-update} $(date -u +%F)"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
            gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 || true
          fi
